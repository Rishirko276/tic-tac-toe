<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Tic Tac Toe</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;background:radial-gradient(circle,#182848,#05070f)}
.container{text-align:center}
h1{font-size:48px;background:linear-gradient(90deg,#4fd1ff,#ff4fd8);-webkit-background-clip:text;color:transparent}
#status{margin:15px;font-size:22px}
.board{display:grid;grid-template-columns:repeat(3,100px);gap:8px;justify-content:center}
.cell{width:100px;height:100px;border:2px solid #4fd1ff;border-radius:14px;background:#111a33;display:flex;align-items:center;justify-content:center;font-size:54px;cursor:pointer;transition:.2s}
.cell:hover{box-shadow:0 0 15px #4fd1ff;transform:scale(1.05)}
.x{color:#4fd1ff;text-shadow:0 0 10px #4fd1ff}
.o{color:#ff4fd8;text-shadow:0 0 10px #ff4fd8}
button{margin-top:20px;padding:10px 20px;border:none;border-radius:20px;background:linear-gradient(90deg,#4fd1ff,#ff4fd8);color:white;font-size:18px;cursor:pointer}
.watermark{position:fixed;bottom:10px;right:15px;opacity:.3}
</style>
</head>
<body>
<div class="container">
<h1>TIC TAC TOE</h1>
<div id="status">Player X's Turn</div>
<div class="board" id="board"></div>
<button onclick="resetGame()">Restart</button>
</div>
<div class="watermark">Rishirko276</div>
<script>
const board=document.getElementById('board');
const statusEl=document.getElementById('status');
let current='X',active=true,state=Array(9).fill('');
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
for(let i=0;i<9;i++){
 const c=document.createElement('div');
 c.className='cell';
 c.onclick=()=>play(i,c);
 board.appendChild(c);
}
function play(i,c){
 if(!active||state[i])return;
 state[i]=current;
 c.textContent=current;
 c.classList.add(current.toLowerCase());
 for(const w of wins){
   const[a,b,d]=w;
   if(state[a]&&state[a]===state[b]&&state[a]===state[d]){
      statusEl.textContent='🎉 Player '+current+' Wins!';
      active=false;return;
   }
 }
 if(!state.includes('')){statusEl.textContent="It's a Draw!";active=false;return;}
 current=current==='X'?'O':'X';
 statusEl.textContent="Player "+current+"'s Turn";
}
function resetGame(){
 state=Array(9).fill('');current='X';active=true;
 statusEl.textContent="Player X's Turn";
 document.querySelectorAll('.cell').forEach(c=>{c.textContent='';c.className='cell';});
}
</script>
</body>
</html>
